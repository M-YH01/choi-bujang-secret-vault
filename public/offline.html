<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | BYTE BACK 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; display: grid; place-items: center; }
    main { max-width: 520px; padding: 32px 22px; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>인터넷에 연결되어 있지 않아 자료실을 열 수 없습니다. 이 앱은 <strong>보호 자료를 이 기기에 저장해 두지 않기 때문에</strong> 오프라인에서는 메모를 보여 줄 수 없습니다.</p>
    <p>연결이 돌아오면 이 화면을 새로고침하세요. 자료는 서버가 이 기기를 승인된 기기로 확인한 뒤에만 열립니다.</p>
  </main>
</body>
</html>
